[build]
  command = "npm install --legacy-peer-deps && npm run build"
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "18"
  GO_VERSION = "1.19"
  NPM_FLAGS = "--legacy-peer-deps"


# Enables Single Page App (SPA) routing (if needed)

[[redirects]]
from = "/studio/*"
to = "/studio/index.html"
status = 200


[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
